# Publishes a release when the version in Guldbog/Guldbog.toc changes on main
# (or when run by hand): test -> zip -> GitHub release + tag -> CurseForge.
# A manual run only uploads to CurseForge if "Also upload to CurseForge" is ticked.
# A version that already has a tag is skipped, so nothing is published twice.
name: Release

on:
  push:
    branches: [main]
    paths: ["Guldbog/Guldbog.toc"]
  workflow_dispatch:
    inputs:
      curseforge:
        description: "Also upload to CurseForge"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_RELEASE_TYPE: release
      CF_GAME_VERSION: "1.60.1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 tools/release.py version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released – nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: |
          pip install lupa
          python3 tests/test_guldbog.py Guldbog

      - name: Build zip
        if: steps.version.outputs.skip != 'true'
        run: python3 tools/package.py

      - name: GitHub release
        if: steps.version.outputs.skip != 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          python3 tools/release.py notes "$V" > notes.md
          gh release create "v$V" "dist/Guldbog-$V.zip" --target "$GITHUB_SHA" \
            --title "Guldbog $V" --notes-file notes.md

      - name: Upload to CurseForge
        if: steps.version.outputs.skip != 'true' && (github.event_name == 'push' || inputs.curseforge)
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: python3 tools/release.py upload "dist/Guldbog-${{ steps.version.outputs.version }}.zip" "${{ steps.version.outputs.version }}"
